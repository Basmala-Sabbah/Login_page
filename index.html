<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .image-section {
            background-image: url("./img/iiii.jpg");
            background-size: cover;
            background-position: center;
        }
    </style>

</head>


<body>


    <div class="container-fluid vh-100 bg-light">

        <div class="row h-100">
            <!-- Image Side -->

            <div class="col-lg-7 d-none d-lg-flex image-section justify-content-center align-items-center text-white">

                <div class="text-center">

                    <h1 class="display-4 fw-bold">
                        Welcome Back
                    </h1>
                    <p class="fs-5">
                        Login to continue your journey
                    </p>

                </div>

            </div>
            <!-- Login Side -->

            <div class="col-12 col-lg-5 d-flex justify-content-center align-items-center">

                <div class="card shadow border-0 rounded-4 p-4 col-12 col-md-8 col-lg-10">
                    <div class="card-body">
                        <!-- Logo -->

                        <img src="./img/Logo2.png" class="rounded-circle mb-3 d-block mx-auto object-fit-cover"
                            width="60" height="60" alt="Logo">

                        <h2 class="text-center fw-bold mb-2">

                            Login

                        </h2>

                        <p class="text-center text-muted mb-4">

                            Enter your account details

                        </p>

                        <form>

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>
                                <input type="email" class="form-control rounded-3 py-2" placeholder="example@email.com"
                                    required>
                            </div>

                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Password
                                </label>

                                <input type="password" class="form-control rounded-3 py-2" placeholder="Enter password"
                                    required>

                            </div>

                            <!-- Remember + Forgot -->

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input class="form-check-input" type="checkbox" id="remember">

                                    <label class="form-check-label" for="remember">

                                        Remember me

                                    </label>
                                </div>

                                <a href="#" class="text-decoration-none">

                                    Forgot password?

                                </a>

                            </div>


                            <!-- Button -->


                            <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-bold">

                                Log In

                            </button>
                        </form>

                    </div>

                </div>
            </div>

        </div>

    </div>

</body>

</html>
