<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .image-section {
            background-image: url("./img/iiii.jpg");
            background-size: cover;
            background-position: center;
        }

        .login-card {
            max-width: 420px;
            border: none;
            border-radius: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin: auto;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-login {
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <!---->

    <div class="container-fluid vh-100">

        <div class="row h-100">

            <!-- Image Side -->
            <div class="col-lg-7 d-none d-lg-flex image-section justify-content-center align-items-center text-white">

                <div class="text-center">
                    <h1 class="display-4 fw-bold">Welcome Back</h1>
                    <p class="fs-5">Login to continue your journey</p>
                </div>

            </div>


            <!-- Login Side -->
            <div class="col-12 col-lg-5 d-flex justify-content-center align-items-center">

                <div class="card shadow login-card p-4 col-12 col-md-8 col-lg-10">

                    <div class="card-body">


                        <!-- Logo -->
                        <img src="./img/Logo2.png" class="logo mb-3 d-block" alt="Logo">


                        <h2 class="text-center fw-bold mb-2">
                            Login
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Enter your account details
                        </p>


                        <form>


                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <input type="email" class="form-control" placeholder="example@email.com" required>

                            </div>



                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Password
                                </label>

                                <input type="password" class="form-control" placeholder="Enter password" required>

                            </div>



                            <!-- Remember + Forgot -->

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input class="form-check-input" type="checkbox" id="remember">

                                    <label class="form-check-label" for="remember">

                                        Remember me

                                    </label>

                                </div>


                                <a href="#" class="text-decoration-none">
                                    Forgot password?
                                </a>


                            </div>



                            <!-- Button -->

                            <button type="submit" class="btn btn-primary w-100 btn-login">

                                Log In

                            </button>


                        </form>


                    </div>

                </div>

            </div>


        </div>

    </div>


</body>

</html>
